name: Deploy CoWorkOS website
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download account-owned static bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-20261101-migration --repo "${{ github.repository }}" --pattern "assets.zip.part-*" --dir bundle
          cat bundle/assets.zip.part-* > bundle/assets.zip
          mkdir _site
          unzip -q bundle/assets.zip -d _site
      - name: Add web-optimized full demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/videos
          gh release download promo-v23-web-20261102 --repo "${{ github.repository }}" --pattern "web-v23.mp4.part-*" --dir promo
          cat promo/web-v23.mp4.part-* > _site/videos/CoworkOS-v23-Web-1080p.mp4
          echo "9a5017db0cdfb84d3e03d38105fe45d63e19821580fdaac15d0c6afd59a44090  _site/videos/CoworkOS-v23-Web-1080p.mp4" | sha256sum -c -
      - name: Exclude local upload tooling
        run: rm -f _site/media-import.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
